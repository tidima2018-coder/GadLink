
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение почты — GadLink</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101012;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #242024;
      border: 1px solid #393239;
      border-radius: 24px;
      padding: 38px 25px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      color: #ee91a5;
      margin-bottom: 25px;
    }

    h1 { font-size: 25px; }

    p {
      color: #c9bac0;
      line-height: 1.6;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border-radius: 12px;
      background: #ee91a5;
      color: #171316;
      font-weight: bold;
      text-decoration: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">GadLink</div>

    <h1 id="title">Подтверждение почты</h1>

    <p id="status">
      Проверяем ссылку подтверждения...
    </p>

    <a id="home" class="button hidden" href="/">
      Перейти в GadLink
    </a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // Вставь значения из существующего проекта GadLink
    const SUPABASE_URL = "https://efvnyjvvijbwzaglxpbd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_W9agBe00b6SuGj_n9a380g_D8Ij8NuK";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const home = document.getElementById("home");

    async function confirmEmail() {
      const params = new URLSearchParams(
        window.location.search
      );

      const token_hash = params.get("token_hash");
      const type = params.get("type");

      if (!token_hash || type !== "email") {
        title.textContent = "Ошибка подтверждения";
        status.textContent =
          "Ссылка недействительна. Запросите новое письмо.";
        home.classList.remove("hidden");
        return;
      }

      try {
        const { error } = await supabase.auth.verifyOtp({
          token_hash,
          type: "email"
        });

        if (error) throw error;

        title.textContent = "Почта подтверждена!";
        status.textContent =
          "Аккаунт успешно активирован. Теперь можно войти в GadLink.";

        window.history.replaceState(
          {},
          "",
          window.location.pathname
        );

      } catch (error) {
        console.error("Email confirmation:", error);

        title.textContent = "Ошибка подтверждения";
        status.textContent =
          "Ссылка недействительна или срок её действия истёк. Запросите новое письмо.";
      }

      home.classList.remove("hidden");
    }

    confirmEmail();
  </script>
</body>
</html>
